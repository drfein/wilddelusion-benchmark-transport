name: test

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src scripts tests
      - run: pytest
      - run: wd-reproduce verify
      - run: wd-reproduce run all --dry-run --no-resume --allow-api --allow-gpu
