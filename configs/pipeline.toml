{python} {experiment}/delusion_recognition_transport/run_psychosis_bench_stochastic.py --cases "$cases" --output "$synth/generations_olmo3_7b_t1.jsonl" --model {repo}/.cache/models/olmo3-7b --reported-model allenai/Olmo-3-7B-Instruct --checkpoint-source allenai/Olmo-3-7B-Instruct --revision 6e5971d9eba42665f5bd5a0fcf047f299ce1dccc
