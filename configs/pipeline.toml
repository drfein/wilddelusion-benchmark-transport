[stages.judge_psychogenic]
description = "Apply the pinned gpt-4o-mini DCS judge independently to all three psychogenic designs."
deps = ["generate_psychogenic"]
kind = "api"
required_env = ["OPENAI_API_KEY"]
outputs = [
  "experiments/lost_in_delusion_replication_260600975/cross_domain_comparison/synthetic_psychosis_bench/stochastic_results/judgments.dcs-gpt4o-mini.jsonl",
  "experiments/lost_in_delusion_replication_260600975/cross_domain_comparison/synthetic_psychosis_bench/local_results/judgments.dcs-gpt4o-mini.jsonl",
  "experiments/lost_in_delusion_replication_260600975/psychogenic_machine_transport_250910970/full522/stochastic_results/judgments.dcs-gpt4o-mini.jsonl",
  "experiments/lost_in_delusion_replication_260600975/cross_domain_comparison/synthetic_psychosis_bench/stochastic_results/judgments.dcs-gpt4o-mini.jsonl.manifest.json",
  "experiments/lost_in_delusion_replication_260600975/cross_domain_comparison/synthetic_psychosis_bench/local_results/judgments.dcs-gpt4o-mini.jsonl.manifest.json",
  "experiments/lost_in_delusion_replication_260600975/psychogenic_machine_transport_250910970/full522/stochastic_results/judgments.dcs-gpt4o-mini.jsonl.manifest.json",
]
command = """
synth={experiment}/cross_domain_comparison/synthetic_psychosis_bench/stochastic_results
local={experiment}/cross_domain_comparison/synthetic_psychosis_bench/local_results
real={experiment}/psychogenic_machine_transport_250910970/full522/stochastic_results
models='allenai/Olmo-3-7B-Instruct meta-llama/Llama-3.1-8B-Instruct Qwen/Qwen3-4B'
{python} {experiment}/psychogenic_machine_transport_250910970/judge_dcs_exact.py --inputs "$synth/generations_olmo3_7b_t1.jsonl" "$synth/generations_llama31_8b_t1.jsonl" "$synth/generations_qwen3_4b_t1.jsonl" --output "$synth/judgments.dcs-gpt4o-mini.jsonl" --models $models --expected-per-model 576 --model gpt-4o-mini-2024-07-18
{python} {experiment}/psychogenic_machine_transport_250910970/judge_dcs_exact.py --inputs "$local/generations_olmo3_7b_t1.jsonl" "$local/generations_llama31_8b_t1.jsonl" "$local/generations_qwen3_4b_t1.jsonl" --output "$local/judgments.dcs-gpt4o-mini.jsonl" --models $models --expected-per-model 864 --model gpt-4o-mini-2024-07-18
{python} {experiment}/psychogenic_machine_transport_250910970/judge_dcs_exact.py --inputs "$real/generations_olmo3_7b_t1.jsonl" "$real/generations_llama31_8b_t1.jsonl" "$real/generations_qwen3_4b_t1.jsonl" --output "$real/judgments.dcs-gpt4o-mini.jsonl" --models $models --expected-per-model 1962 --model gpt-4o-mini-2024-07-18
"""

[stages.analyze_psychogenic]
description = "Recompute pooled, model, seed, scenario, leave-one-out, and exact sign-flip analyses."
deps = ["judge_psychogenic"]
outputs = ["experiments/lost_in_delusion_replication_260600975/cross_domain_comparison/psychogenic_robustness/claim_gate.json"]
command = """
{python} {experiment}/cross_domain_comparison/analyze_psychogenic_robustness.py
"""

[stages.build_claim_registry]
description = "Apply the non-overlap rule and select exactly five claims whose locked gates pass."
deps = [
  "analyze_visible_harm",
  "analyze_control_realism",
  "analyze_psychogenic",
  "analyze_theme_coverage",
  "analyze_recognition_gap",
]
outputs = ["experiments/lost_in_delusion_replication_260600975/cross_domain_comparison/abstract_claim_registry/claim_registry.json"]
command = """
{python} {experiment}/cross_domain_comparison/build_claim_registry.py
"""

[stages.verify_claims]
description = "Fail unless exactly five distinct evidence families satisfy every claim-specific gate."
deps = ["build_claim_registry"]
outputs = ["experiments/lost_in_delusion_replication_260600975/cross_domain_comparison/abstract_claim_registry/COMPLETION_AUDIT.json"]
command = """
{python} {experiment}/cross_domain_comparison/verify_abstract_claims.py
"""

[stages.sync_results]
description = "Publish only compact gates, tables, and the completion audit at the repository root."
deps = ["verify_claims"]
outputs = ["results/claim_registry.json", "results/COMPLETION_AUDIT.json"]
command = """
{python} {repo}/scripts/sync_results.py \
  --source {experiment}/cross_domain_comparison/abstract_claim_registry \
  --destination {repo}/results
"""

[stages.all]
description = "Complete reproduction: immutable inputs, generation, judging, five analyses, and fail-closed verification."
deps = ["sync_results"]
outputs = ["results/COMPLETION_AUDIT.json"]
command = """
echo 'All five result families reproduced and verified.'
"""
