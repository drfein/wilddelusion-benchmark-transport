[stages.adjudicate_themes]
description = "Apply two independently worded closed-ontology rubrics to all 522 positive endpoints."
deps = ["prepare_recognition_inputs"]
kind = "api"
required_env = ["OPENAI_API_KEY"]
outputs = [
  "experiments/lost_in_delusion_replication_260600975/delusion_recognition_transport/artifacts/paper_theme_fit_a.jsonl",
  "experiments/lost_in_delusion_replication_260600975/delusion_recognition_transport/artifacts/paper_theme_fit_b.jsonl",
  "experiments/lost_in_delusion_replication_260600975/delusion_recognition_transport/artifacts/paper_theme_fit_a.jsonl.manifest.json",
  "experiments/lost_in_delusion_replication_260600975/delusion_recognition_transport/artifacts/paper_theme_fit_b.jsonl.manifest.json",
]
command = """
for rubric in A B; do
  lower=$(printf '%s' "$rubric" | tr '[:upper:]' '[:lower:]')
  {python} {experiment}/delusion_recognition_transport/adjudicate_paper_theme_fit.py \
    --input {experiment}/delusion_recognition_transport/artifacts/classifier_inputs.jsonl \
    --output {experiment}/delusion_recognition_transport/artifacts/paper_theme_fit_"$lower".jsonl \
    --rubric-version "$rubric" \
    --model gpt-5.4-mini-2026-03-17
done
"""

[stages.analyze_control_realism]
description = "Estimate natural-minus-generated FPR gaps with adversarial parse bounds and clustered 99% intervals."
deps = ["audit_natural_controls", "classify_recognition"]
outputs = ["experiments/lost_in_delusion_replication_260600975/cross_domain_comparison/control_realism/claim_gate.json"]
command = """
{python} {experiment}/cross_domain_comparison/analyze_control_realism.py
"""

[stages.analyze_theme_coverage]
description = "Estimate strict outside-ontology coverage with source-conversation clustered uncertainty."
deps = ["adjudicate_themes"]
outputs = ["experiments/lost_in_delusion_replication_260600975/cross_domain_comparison/theme_coverage/claim_gate.json"]
command = """
{python} {experiment}/cross_domain_comparison/analyze_theme_coverage.py
"""

[stages.analyze_recognition_gap]
description = "Partially identify the real OLMo-Llama FNR gap under adversarial malformed-output assignments."
deps = ["adjudicate_themes", "classify_recognition", "fetch_lost_source"]
outputs = ["experiments/lost_in_delusion_replication_260600975/cross_domain_comparison/recognition_model_gap/claim_gate.json"]
command = """
{python} {experiment}/cross_domain_comparison/analyze_recognition_model_gap.py
"""

[stages.generate_psychogenic]
description = "Generate three seeded full synthetic trajectories, matched-local contrasts, and 327 real pairs for three models."
deps = ["prepare_psychogenic_inputs", "fetch_psychosis_bench", "model_llama31", "model_olmo3", "model_qwen3_4b"]
