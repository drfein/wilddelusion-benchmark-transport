  "experiments/lost_in_delusion_replication_260600975/cross_domain_comparison/synthetic_psychosis_bench/local_results/generations_qwen3_4b_t1.jsonl.manifest.json",
  "experiments/lost_in_delusion_replication_260600975/psychogenic_machine_transport_250910970/full522/stochastic_results/generations_llama31_8b_t1.jsonl.manifest.json",
